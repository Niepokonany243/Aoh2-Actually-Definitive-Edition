buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
    }
}
def aoh2BuildStatsFile = rootProject.layout.buildDirectory.file('aoh2-build-stats.properties').get().asFile
def aoh2BuildStats = new Properties()
if (aoh2BuildStatsFile.isFile()) {
    aoh2BuildStatsFile.withInputStream { aoh2BuildStats.load(it) }
}
def aoh2ReadStat = { String name -> (aoh2BuildStats.getProperty(name, '0') as int) }
def aoh2WriteStats = {
    aoh2BuildStatsFile.parentFile.mkdirs()
    aoh2BuildStatsFile.withOutputStream { aoh2BuildStats.store(it, 'AoH2 Gradle build stats') }
}
def aoh2StatsOnlyTasks = ['printBuildStats', 'projects', 'tasks']
def aoh2TaskNames = gradle.startParameter.taskNames
def aoh2CountThisInvocation = aoh2TaskNames.isEmpty() || !aoh2TaskNames.every { taskName ->
    aoh2StatsOnlyTasks.any { statsTask -> taskName == statsTask || taskName.endsWith(":${statsTask}") }
}
def aoh2Attempt = aoh2ReadStat('attempts')
def aoh2ThisBuildErrors = 0
if (aoh2CountThisInvocation) {
    aoh2Attempt++
    aoh2BuildStats.setProperty('attempts', aoh2Attempt.toString())
    aoh2BuildStats.setProperty('lastStarted', new Date().format("yyyy-MM-dd HH:mm:ss"))
    aoh2WriteStats()
}
gradle.taskGraph.afterTask { task, state ->
    if (aoh2CountThisInvocation && state.failure != null) {
        aoh2ThisBuildErrors++
    }
}

gradle.buildFinished { result ->
    if (aoh2CountThisInvocation) {
        if (result.failure == null) {
            aoh2BuildStats.setProperty('successes', (aoh2ReadStat('successes') + 1).toString())
            aoh2BuildStats.setProperty('lastResult', 'SUCCESS')
            aoh2BuildStats.setProperty('lastError', '')
        } else {
            if (aoh2ThisBuildErrors == 0) {
                aoh2ThisBuildErrors = 1
            }
            aoh2BuildStats.setProperty('failures', (aoh2ReadStat('failures') + 1).toString())
            aoh2BuildStats.setProperty('totalErrors', (aoh2ReadStat('totalErrors') + aoh2ThisBuildErrors).toString())
            aoh2BuildStats.setProperty('lastResult', 'FAILED')
            aoh2BuildStats.setProperty('lastError', result.failure.message ?: result.failure.toString())
        }
        aoh2BuildStats.setProperty('lastErrors', aoh2ThisBuildErrors.toString())
        aoh2BuildStats.setProperty('lastFinished', new Date().format("yyyy-MM-dd HH:mm:ss"))
        aoh2WriteStats()

        logger.lifecycle("")
        logger.lifecycle("=== AoH2 Build Counter ===")
        logger.lifecycle("Attempts: ${aoh2BuildStats.getProperty('attempts', '0')} | Successes: ${aoh2BuildStats.getProperty('successes', '0')} | Failed builds: ${aoh2BuildStats.getProperty('failures', '0')}")
        logger.lifecycle("Total errors: ${aoh2BuildStats.getProperty('totalErrors', '0')} | Last build errors: ${aoh2BuildStats.getProperty('lastErrors', '0')} | Result: ${aoh2BuildStats.getProperty('lastResult', 'UNKNOWN')}")
        logger.lifecycle("Stats file: ${aoh2BuildStatsFile}")
        if (result.failure != null) {
            logger.lifecycle("Last error: ${aoh2BuildStats.getProperty('lastError', '')}")
        }
        logger.lifecycle("==========================")
        logger.lifecycle("")
    }
}

tasks.register('printBuildStats') {
    group = 'help'
    description = 'Prints persistent AoH2 Gradle build/error counters.'
    doLast {
        logger.lifecycle("=== AoH2 Build Counter ===")
        logger.lifecycle("Attempts: ${aoh2BuildStats.getProperty('attempts', '0')}")
        logger.lifecycle("Successes: ${aoh2BuildStats.getProperty('successes', '0')}")
        logger.lifecycle("Failed builds: ${aoh2BuildStats.getProperty('failures', '0')}")
        logger.lifecycle("Total errors: ${aoh2BuildStats.getProperty('totalErrors', '0')}")
        logger.lifecycle("Last build errors: ${aoh2BuildStats.getProperty('lastErrors', '0')}")
        logger.lifecycle("Last result: ${aoh2BuildStats.getProperty('lastResult', 'UNKNOWN')}")
        logger.lifecycle("Last started: ${aoh2BuildStats.getProperty('lastStarted', '')}")
        logger.lifecycle("Last finished: ${aoh2BuildStats.getProperty('lastFinished', '')}")
        logger.lifecycle("Stats file: ${aoh2BuildStatsFile}")
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "AoH2"
        gdxVersion = '1.14.0'
        roboVMVersion = '2.3.16'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.1'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://jitpack.io" }
    }
}

project(':core') {
    apply plugin: 'java-library'
    sourceSets {
        main {
            java {
                srcDirs = ['../']
                include 'age/**'
                include 'aoc/**'
                include 'space/**'
                exclude 'aoc/kingdoms/lukasz/jakowski/desktop/**'
                exclude 'aoc/kingdoms/lukasz/jakowski/android/**'
                exclude 'com/**'
                exclude 'org/**'
                exclude 'javazoom/**'
            }
        }
    }
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.code-disaster.steamworks4j:steamworks4j:1.9.0"
        api "space.earlygrey:shapedrawer:2.6.0"
        api "javazoom:jlayer:1.0.1"
    }
}

project(':desktop') {
    apply plugin: 'application'
    ext.desktopMainClass = 'aoc.kingdoms.lukasz.jakowski.desktop.DesktopLauncher'
    application {
        mainClass = desktopMainClass
    }
    sourceSets {
        main {
            java {
                srcDirs = ['../']
                include 'aoc/kingdoms/lukasz/jakowski/desktop/**'
            }
        }
    }
    dependencies {
        implementation project(':core')

        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    }

    task gameJar(type: Jar) {
        dependsOn project(':core').classes
        dependsOn classes

        archiveFileName = 'game.jar'
        destinationDirectory = rootProject.layout.projectDirectory
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes 'Main-Class': desktopMainClass
        }

        from project(':core').sourceSets.main.output
        from sourceSets.main.output
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }

        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
}
